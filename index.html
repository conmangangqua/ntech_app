<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Trung tâm cài đặt Ứng dụng Nội Bộ chuẩn Premium" />
  <!-- Chống cache triệt để để luôn tải file JSON mới nhất -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>App Release Hub</title>
  
  <style>
    /* CSS Tối ưu Hóa chuẩn Web UI/UX Pro Max */
    :root {
      --bg-surface: #0f172a; /* Slate 900 */
      --bg-card: rgba(30, 41, 59, 0.7); /* Slate 800 with opacity for glassmorphism */
      --border-card: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc; /* Slate 50 */
      --text-muted: #94a3b8; /* Slate 400 */
      --accent-blue: #3b82f6; /* Blue 500 */
      --accent-blue-hover: #2563eb; /* Blue 600 */
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-orange: #f59e0b;
      --accent-orange-hover: #d97706;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--bg-surface);
      background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.1), transparent 40%);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Container khóa cỡ màn hình khổng lồ, giãn ở mobile */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Header chuẩn phân tầng thẻ H1 H2 */
    header {
      text-align: center;
      margin-bottom: 3.5rem;
      animation: fadeInDown 0.6s ease-out;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 65ch; /* Giới hạn độ dài dòng đọc */
      margin: 0 auto;
    }

    /* Grid layout auto-fit */
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    /* Card thiết kế chuẩn Glassmorphism kiểm soát */
    .app-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 1.25rem;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease;
      animation: fadeInUp 0.5s ease-out both;
    }

    .app-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    /* Tạo dải độ lùi cho animation card */
    .app-card:nth-child(1) { animation-delay: 0.1s; }
    .app-card:nth-child(2) { animation-delay: 0.2s; }
    .app-card:nth-child(3) { animation-delay: 0.3s; }
    .app-card:nth-child(4) { animation-delay: 0.4s; }

    .card-header {
      display: flex;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }

    /* Anti-CLS cho hình ảnh (Cố định khung, tỷ lệ 1/1) */
    .app-icon {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
      border-radius: 1.2rem;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      aspect-ratio: 1/1; 
      display: block;
    }

    .app-title-group {
      margin-left: 1.25rem;
      flex-grow: 1;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.25rem;
      line-height: 1.2;
    }

    .platform-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
    }

    .platform-badge.ios {
      background-color: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .platform-badge.android {
      background-color: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .app-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      flex-grow: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .feature-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .feature-tag {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
    }

    /* Các Nút Bấm chuẩn Priority 1 */
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: auto;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 48px; /* Tối thiểu chạm cho ngón tay Mobile */
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      outline: none;
    }
    
    /* Hỗ trợ bàn phím Focus - Tiêu chuẩn Phản bồi số 1 */
    .btn:focus-visible {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
    }

    .btn:active {
      transform: scale(0.97); /* Micro-interaction độ nén nút */
    }

    .btn-dev {
      background-color: var(--accent-blue);
    }
    .btn-dev:hover {
      background-color: var(--accent-blue-hover);
    }
    .btn-prod {
      background-color: var(--accent-green);
    }
    .btn-prod:hover {
      background-color: var(--accent-green-hover);
    }
    .btn-aab {
      background-color: var(--accent-orange);
    }
    .btn-aab:hover {
      background-color: var(--accent-orange-hover);
    }


    .btn-stack { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.1; }
    .btn-stack .ver { font-size: 10px; font-weight: 600; opacity: 0.75; letter-spacing: 0; }
    /* Skeleton Placeholder hoặc Báo Lỗi */
    .system-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      background: var(--bg-card);
      border-radius: 1.25rem;
      border: 1px dashed rgba(255,255,255,0.2);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>

  </style>

    .btn{position:relative}

</head>
<body>

  <div class="container">
    <header>
      <h1>📱 Cổng Cài Đặt Ứng Dụng</h1>
      <p>Lựa chọn phiên bản Test (Dev) hoặc Hoàn thiện (Live) tương ứng với nền tảng thiết bị di động của bạn.</p>
    </header>

    <main id="appContainer">
      <!-- Dữ liệu JS sẽ đổ bộ vào đây -->
    </main>
  </div>

  <script>
    // Logic Javascript không đổi
    fetch("apps.json")
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById("appContainer");
        
        if (!data.apps || data.apps.length === 0) {
          container.innerHTML = '<div class="system-msg">Chưa có ứng dụng nào được xuất bản. Vui lòng quay lại sau!</div>';
          return;
        }

        data.apps.forEach((app, index) => {
          const isIOS = (app.platform || "").toLowerCase().includes("ios");
        const isAndroid = !app.platform || app.platform.toLowerCase().includes("android");
        const buildLabel = (isIOS && !isAndroid) ? "Build TestFlight" : "Build AAB";
          const iconSrc = app.icon || "";
          
          const devUrl = app.downloads?.dev || "";
          const prodUrl = app.downloads?.prod || "";
          
        const v = app.versions || {};
        const stack = (label, k) => v[k]
          ? `<span class="btn-stack">${label}<span class="ver">v${v[k]}</span></span>`
          : `<span class="btn-stack">${label}</span>`;
          /* Logic Định Tuyến cho IOS bắt buộc Mã Hoá URL an toàn */
          const formatUrl = (url, isIOS) => {
            if (!url) return "";
            if (isIOS) return "itms-services://?action=download-manifest&url=" + encodeURIComponent(url);
            return url;
          };

          const features = (app.features || [])
            .map(f => `<span class="feature-tag">${f}</span>`)
            .join("");

          const html = `
            <article class="app-card">
              <div class="card-header">
                <div class="app-icon">
                  ${iconSrc ? `<img src="${iconSrc}" alt="Icon ${app.name}" width="80" height="80" onerror="this.style.display='none'">` : '<div style="width:100%;height:100%;background:linear-gradient(135deg,#1e293b,#0f172a);"></div>'}
                </div>
                <div class="app-title-group">
                  <h2 class="app-title">${app.name || "App Name"}</h2>
                  <span class="platform-badge ${isIOS ? 'ios' : 'android'}">OS: ${app.platform || "Android"}</span>
                </div>
              </div>
              
              <p class="app-desc">${app.description || "Chưa có mô tả"}</p>
              
              ${features ? `<div class="feature-group">${features}</div>` : ""}
              
              <div class="card-actions">
                ${devUrl ? `<a class="btn btn-dev" href="${formatUrl(devUrl, isIOS)}" aria-label="Cài đặt bản Dev của ${app.name}"><span class="btn-ic">🛠</span>${stack('Cài bản Dev','dev')}</a>` : ""}
                ${prodUrl ? `<a class="btn btn-prod" href="${formatUrl(prodUrl, isIOS)}" aria-label="Cài đặt bản Live của ${app.name}"><span class="btn-ic">🚀</span>${stack('Cài bản Live','prod')}</a>` : ""}
                ${app.downloads?.aab ? `<a class="btn btn-aab" href="${app.downloads.aab}"><span class="btn-ic">📦</span>${stack('Tải file AAB','aab')}</a>` : ""}
                ${app.store ? `<a class="btn btn-store" href="${app.store}" target="_blank" rel="noopener"><span class="btn-ic">🛒</span><span class="btn-stack">View on Store</span></a>` : ""}
          <button type="button" class="btn btn-build" onclick="openBuildModal('${app.id}', '${(app.name || '').replace(/'/g, "\\'")}')"><span class="btn-ic">🔨</span><span class="btn-stack">${buildLabel}</span></button><button type="button" class="btn btn-gd" onclick="openViewDesc('${app.id}', '${(app.name || '').replace(/'/g, "\'")}')">📄 Description</button><button type="button" class="btn btn-as" onclick="dlAssets('${app.id}', '${(app.name || '').replace(/'/g, "\'")}', this)">⬇️ Assets</button>
              </div>
            </article>
          `;
          container.insertAdjacentHTML("beforeend", html);
        });
      })
      .catch(err => {
        document.getElementById("appContainer").innerHTML = '<div class="system-msg" style="color:var(--accent-orange)"><b>❌ Lỗi Hệ Thống:</b> Không thể tải danh sách ứng dụng. Vui lòng F5 (tải lại trang).</div>';
        console.error("Lỗi Fetch JSON:", err);
      });
  </script>

  <div class="aab-ov" id="buildModal">
    <div class="aab-md">
      <h3 id="bmTitle">🔨 Build</h3>
      <p class="sub" id="bmApp"></p>
      <label>Version Name</label>
      <input type="text" id="bmName" placeholder="vd 1.0.1" autocomplete="off">
      <label>Version Code</label>
      <input type="text" id="bmCode" inputmode="numeric" placeholder="vd 26051501" autocomplete="off">
      <label>Mã PIN</label>
      <input type="password" id="bmPin" inputmode="numeric" placeholder="Nhập PIN" autocomplete="off">
      <div class="aab-st" id="bmStatus"></div>
      <div class="aab-act">
        <button type="button" class="aab-cancel" onclick="closeBuildModal()">Huỷ</button>
        <button type="button" class="aab-ok" id="bmOk" onclick="submitBuild()">Build</button>
      </div>
    </div>
  </div>
  <script>
    const BUILD_API = "https://aab-trigger.vercel.app";
    let bmAppId = "";
    const $ = (id) => document.getElementById(id);
    async function openBuildModal(appId, appName) {
      bmAppId = appId;
      $("bmTitle").textContent = "🔨 Build";
      $("bmApp").textContent = appName + " — kích build từ xa";
      $("bmName").value = ""; $("bmCode").value = ""; $("bmPin").value = "";
      $("bmStatus").style.color = "#64748b";
      $("bmStatus").textContent = "Đang lấy version hiện tại...";
      $("bmOk").disabled = true;
      $("buildModal").classList.add("open");
      try {
        const r = await fetch(BUILD_API + "/api/version?app_id=" + encodeURIComponent(appId));
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "Không lấy được version");
        $("bmTitle").textContent = "🔨 Build " + (d.build_label || "");
        $("bmApp").textContent = appName + " — " + (d.platform === "ios" ? "iOS TestFlight" : "Android AAB");
        $("bmName").value = d.version_name || "";
        $("bmCode").value = d.suggested_code || d.version_code || "";
        $("bmStatus").style.color = "#64748b";
        $("bmStatus").textContent = "Hiện tại: " + d.current_name + "+" + d.current_code + " → đề xuất code mới: " + d.suggested_code;
      } catch (e) {
        $("bmStatus").style.color = "#ef4444";
        $("bmStatus").textContent = "⚠️ " + e.message;
      } finally {
        $("bmOk").disabled = false;
      }
    }
    function closeBuildModal() { $("buildModal").classList.remove("open"); }
    async function submitBuild() {
      const payload = { app_id: bmAppId, version_name: $("bmName").value.trim(), version_code: $("bmCode").value.trim(), pin: $("bmPin").value.trim() };
      if (!payload.version_name || !payload.version_code || !payload.pin) {
        $("bmStatus").style.color = "#ef4444";
        $("bmStatus").textContent = "⚠️ Điền đủ Version Name, Code và PIN.";
        return;
      }
      $("bmOk").disabled = true;
      $("bmStatus").style.color = "#64748b";
      $("bmStatus").textContent = "⏳ Đang kích build...";
      try {
        const r = await fetch(BUILD_API + "/api/build", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || "Build thất bại");
        $("bmStatus").style.color = "#059669";
        closeBuildModal(); showSnack("✅ " + (d.message || "Đã kích build"), d.pipeline_url, false);
      } catch (e) {
        $("bmStatus").style.color = "#ef4444";
        $("bmStatus").textContent = "❌ " + e.message;
      } finally {
        $("bmOk").disabled = false;
      }
    }
    document.getElementById("buildModal").addEventListener("click", (e) => { if (e.target.id === "buildModal") closeBuildModal(); });
  </script>

  <style>/* AAB_LOGIN */

  <button id="aablBtn" type="button">🔒 Đăng nhập</button>
  <div id="aablOv"><div id="aablMd">
    <h3>🔒 Đăng nhập Build</h3>
    <input id="aablPin" type="password" inputmode="numeric" placeholder="Nhập mã PIN" autocomplete="off">
    <div id="aablMsg"></div>
    <div id="aablAct">
      <button type="button" class="aabl-cancel" id="aablCancel">Huỷ</button>

  <script>(function(){
    var API="https://aab-trigger.vercel.app", KEY="aab_authed";
    var b=document.body,
        btn=document.getElementById("aablBtn"),
        ov=document.getElementById("aablOv"),
        pin=document.getElementById("aablPin"),
        msg=document.getElementById("aablMsg"),
        ok=document.getElementById("aablOk"),
        cancel=document.getElementById("aablCancel");
    function authed(){return localStorage.getItem(KEY)==="1";}
    function render(){ if(authed()){b.classList.add("aab-authed");btn.textContent="🔓 Đăng xuất";} else {b.classList.remove("aab-authed");btn.textContent="🔒 Đăng nhập";} }
    function close(){ov.classList.remove("open");pin.value="";msg.textContent="";}
    btn.onclick=function(){ if(authed()){ localStorage.removeItem(KEY); render(); } else { ov.classList.add("open"); setTimeout(function(){pin.focus();},50); } };
    cancel.onclick=close;
    ov.addEventListener("click",function(e){ if(e.target===ov) close(); });
    pin.addEventListener("keydown",function(e){ if(e.key==="Enter") ok.click(); });
    ok.onclick=async function(){
      var v=(pin.value||"").trim();
      if(!v){ msg.style.color="#ef4444"; msg.textContent="Nhập PIN."; return; }
      ok.disabled=true; msg.style.color="#64748b"; msg.textContent="Đang kiểm tra...";
      try{
        var r=await fetch(API+"/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:v})});
        var d=await r.json();
        if(!r.ok||!d.ok) throw new Error(d.error||"Sai mã PIN");
        localStorage.setItem(KEY,"1"); render(); close();
      }catch(e){ msg.style.color="#ef4444"; msg.textContent="❌ "+e.message; }
      finally{ ok.disabled=false; }
    };
    render();
  })();</script>

  <style>/* AAB_SNACK */

      max-width:92vw;width:max-content;background:#0f172a;color:#fff;padding:14px 18px;border-radius:14px;
      font:600 14px/1.4 system-ui,-apple-system,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.35);
      z-index:100002;opacity:0;transition:transform .35s cubic-bezier(.2,.9,.3,1),opacity .35s;
      display:flex;align-items:center;gap:14px;text-align:left}

    #aabSnack a{color:#6ee7b7;font-weight:800;text-decoration:none;white-space:nowrap}

  <div id="aabSnack"></div>
  <script>(function(){
    var el=document.getElementById("aabSnack"), t;
    window.showSnack=function(msg,url,isErr){
      clearTimeout(t);
      var link=url?(' <a href="'+url+'" target="_blank" rel="noopener">Xem pipeline ›</a>'):'';
      el.innerHTML='<span>'+msg+link+'</span><span class="x">✕</span>';
      el.className=isErr?'err show':'show';
      el.querySelector(".x").onclick=function(){ el.classList.remove("show"); };
      t=setTimeout(function(){ el.classList.remove("show"); }, 8000);
    };
  })();</script>

    #vdMd input{width:100%;box-sizing:border-box;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:.95rem;font-weight:600;outline:none;margin-top:16px}

  <div id="vdOv"><div id="vdMd">
    <h3>📄 Store Description</h3>
    <p class="s" id="vdApp"></p>
    <div class="lbrow"><span class="lb">Short description</span><button type="button" class="cp" onclick="vdCopy('short',this)">Copy</button></div>
    <div class="box" id="vdShort">…</div>
    <div class="lbrow"><span class="lb">Long description</span><button type="button" class="cp" onclick="vdCopy('long',this)">Copy</button></div>
    <div class="box" id="vdLong">…</div>
    <input id="vdPin" type="password" inputmode="numeric" placeholder="Nhập PIN để Gen lại" autocomplete="off">
    <div id="vdMsg"></div>
    <div id="vdAct">
      <button type="button" class="vd-close" onclick="vdClose()">Đóng</button>
      <button type="button" class="vd-gen" id="vdGenBtn" onclick="vdGen()">🔁 Gen lại</button>
    </div>
  </div></div>
  <script>(function(){
    var API="https://aab-trigger.vercel.app", appId="";
    var ov=document.getElementById("vdOv"),appEl=document.getElementById("vdApp"),
        shortEl=document.getElementById("vdShort"),longEl=document.getElementById("vdLong"),
        pin=document.getElementById("vdPin"),msg=document.getElementById("vdMsg"),
        gb=document.getElementById("vdGenBtn");
    window.vdCopy=function(kind,btn){
      var t=(kind==="short"?shortEl:longEl).textContent||"";
      function done(){ var o=btn.textContent; btn.textContent="Đã copy ✓"; setTimeout(function(){btn.textContent=o;},1500); }
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(t).then(done).catch(function(){fallback(t,done);});
      } else { fallback(t,done); }
    };
    function fallback(t,cb){
      var ta=document.createElement("textarea"); ta.value=t;
      ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
      ta.focus(); ta.select();
      try{ document.execCommand("copy"); cb(); }catch(e){} document.body.removeChild(ta);
    }
    window.openViewDesc=async function(id,nm){
      appId=id; appEl.textContent=nm; pin.value=""; msg.textContent="";
      shortEl.textContent="Đang tải…"; longEl.textContent="Đang tải…";
      ov.classList.add("open");
      try{
        var r=await fetch(API+"/api/description?app_id="+encodeURIComponent(id));
        var d=await r.json();
        if(!r.ok) throw new Error(d.error||"Không tải được");
        if(!d.exists){ shortEl.textContent="(Chưa có — bấm Gen lại để tạo)"; longEl.textContent="(Chưa có)"; }
        else { shortEl.textContent=d.short||"(trống)"; longEl.textContent=d.long||"(trống)"; }
      }catch(e){ shortEl.textContent="⚠️ "+e.message; longEl.textContent=""; }
    };
    window.vdClose=function(){ ov.classList.remove("open"); };
    ov.addEventListener("click",function(e){ if(e.target===ov) vdClose(); });
    window.vdGen=async function(){
      var v=(pin.value||"").trim();
      if(!v){ msg.style.color="#ef4444"; msg.textContent="Nhập PIN để Gen lại."; return; }
      gb.disabled=true; msg.style.color="#64748b"; msg.textContent="⏳ Đang kích gen…";
      try{
        var r=await fetch(API+"/api/gendesc",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({app_id:appId,pin:v})});
        var d=await r.json();
        if(!r.ok||!d.ok) throw new Error(d.error||"Thất bại");
        vdClose();
        if(window.showSnack) showSnack("📝 "+d.message+" (vài phút có bản mới)", d.pipeline_url, false);
      }catch(e){ msg.style.color="#ef4444"; msg.textContent="❌ "+e.message; }
      finally{ gb.disabled=false; }
    };
  })();</script>

  <style>/* AAB_ASSETS */
    .btn-as{background:#0369a1;color:#fff;border:1px solid #0369a1;cursor:pointer;display:none!important}

  <script>(function(){
    var API="https://aab-trigger.vercel.app";
    window.dlAssets=async function(id,nm,btn){
      var old=btn.innerHTML; btn.disabled=true; btn.innerHTML="⏳ Đang tải asset…";
      try{
        var r=await fetch(API+"/api/assets?app_id="+encodeURIComponent(id));
        if(!r.ok){ var e={}; try{e=await r.json();}catch(_){} throw new Error(e.error||("HTTP "+r.status)); }
        var cnt=r.headers.get("X-Asset-Count")||"";
        var blob=await r.blob();
        var url=URL.createObjectURL(blob);
        var a=document.createElement("a");
        a.href=url; a.download=id+"_assets.zip";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){URL.revokeObjectURL(url);},4000);
        if(window.showSnack) showSnack("⬇️ Đã tải "+(cnt?cnt+" ":"")+"asset của "+nm,"",false);
      }catch(e){
        if(window.showSnack) showSnack("❌ "+e.message,"",true);
        else alert("Lỗi: "+e.message);
      }finally{ btn.disabled=false; btn.innerHTML=old; }
    };
  })();</script>
